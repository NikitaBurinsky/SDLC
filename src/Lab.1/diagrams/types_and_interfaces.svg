<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1020" width="850" height="1020" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Markers for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333" />
    </marker>
    <marker id="openArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" />
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- 1. Program (Main) -->
  <g transform="translate(330, 20)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="75" rx="5" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.2" />
    <circle cx="28" cy="22" r="10" fill="#48bb78" stroke="#2f855a" stroke-width="1" />
    <text x="28" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">C</text>
    <text x="105" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Program</text>
    <line x1="0" y1="42" x2="190" y2="42" stroke="#cbd5e0" stroke-width="1" />
    <text x="12" y="60" font-size="11" fill="#2d3748">+Main(): void</text>
  </g>

  <!-- 2. MainForm (MainView) -->
  <g transform="translate(40, 150)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="175" rx="5" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.2" />
    <circle cx="28" cy="22" r="10" fill="#48bb78" stroke="#2f855a" stroke-width="1" />
    <text x="28" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">C</text>
    <text x="160" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">MainForm</text>
    <line x1="0" y1="42" x2="300" y2="42" stroke="#cbd5e0" stroke-width="1" />
    <text x="12" y="60" font-size="11" fill="#2d3748">-controller: PlanetWeightController</text>
    <text x="12" y="78" font-size="11" fill="#2d3748">-model: PlanetWeightModel</text>
    <text x="12" y="96" font-size="11" fill="#2d3748">-gridResults: DataGridView</text>
    <text x="12" y="114" font-size="11" fill="#2d3748">-lblCurrentWeight: Label</text>
    <line x1="0" y1="126" x2="300" y2="126" stroke="#cbd5e0" stroke-width="1" />
    <text x="12" y="144" font-size="11" fill="#2d3748">+SetController(controller: PlanetWeightController)</text>
    <text x="12" y="162" font-size="11" fill="#2d3748">+OnModelChanged(sender, e)</text>
  </g>

  <!-- 3. PlanetWeightController -->
  <g transform="translate(430, 360)" filter="url(#shadow)">
    <rect x="0" y="0" width="370" height="135" rx="5" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.2" />
    <circle cx="28" cy="22" r="10" fill="#48bb78" stroke="#2f855a" stroke-width="1" />
    <text x="28" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">C</text>
    <text x="200" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">PlanetWeightController</text>
    <line x1="0" y1="42" x2="370" y2="42" stroke="#cbd5e0" stroke-width="1" />
    <text x="12" y="60" font-size="11" fill="#2d3748">-model: PlanetWeightModel</text>
    <text x="12" y="78" font-size="11" fill="#2d3748">-view: IMainView</text>
    <text x="12" y="96" font-size="11" fill="#2d3748">+LastEnteredWeight: double?</text>
    <line x1="0" y1="108" x2="370" y2="108" stroke="#cbd5e0" stroke-width="1" />
    <text x="12" y="126" font-size="11" fill="#2d3748">+HandleEnterDataCommand(parent: IWin32Window)</text>
  </g>

  <!-- 4. DataEntryForm (InputDialog) -->
  <g transform="translate(490, 620)" filter="url(#shadow)">
    <rect x="0" y="0" width="310" height="145" rx="5" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.2" />
    <circle cx="28" cy="22" r="10" fill="#48bb78" stroke="#2f855a" stroke-width="1" />
    <text x="28" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">C</text>
    <text x="170" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">DataEntryForm</text>
    <line x1="0" y1="42" x2="310" y2="42" stroke="#cbd5e0" stroke-width="1" />
    <text x="12" y="60" font-size="11" fill="#2d3748">-txtWeight: TextBox</text>
    <text x="12" y="78" font-size="11" fill="#2d3748">-btnOk: Button</text>
    <text x="12" y="96" font-size="11" fill="#2d3748">+ResultWeight: double?</text>
    <line x1="0" y1="108" x2="310" y2="108" stroke="#cbd5e0" stroke-width="1" />
    <text x="12" y="126" font-size="11" fill="#2d3748">+DataEntryForm(initialWeight: double?)</text>
  </g>

  <!-- 5. PlanetWeightModel -->
  <g transform="translate(80, 560)" filter="url(#shadow)">
    <rect x="0" y="0" width="330" height="230" rx="5" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.2" />
    <circle cx="28" cy="22" r="10" fill="#48bb78" stroke="#2f855a" stroke-width="1" />
    <text x="28" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">C</text>
    <text x="180" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">PlanetWeightModel</text>
    <line x1="0" y1="42" x2="330" y2="42" stroke="#cbd5e0" stroke-width="1" />
    <text x="12" y="60" font-size="11" fill="#2d3748">-bodies: List&lt;CelestialBody&gt;</text>
    <text x="12" y="78" font-size="11" fill="#2d3748">-earthWeight: double?</text>
    <text x="12" y="96" font-size="11" fill="#2d3748">-results: List&lt;PlanetCalculationResult&gt;</text>
    <text x="12" y="114" font-size="11" fill="#2d3748">+event ModelChanged: EventHandler</text>
    <line x1="0" y1="126" x2="330" y2="126" stroke="#cbd5e0" stroke-width="1" />
    <text x="12" y="144" font-size="11" fill="#2d3748">+SetEarthWeight(weight: double): void</text>
    <text x="12" y="162" font-size="11" fill="#2d3748">+get_EarthWeight(): double?</text>
    <text x="12" y="180" font-size="11" fill="#2d3748">+get_Results(): IReadOnlyList&lt;Result&gt;</text>
    <text x="12" y="198" font-size="11" fill="#2d3748">-calculateWeights(): void</text>
    <text x="12" y="216" font-size="11" fill="#2d3748">-OnModelChanged(e): void</text>
  </g>

  <!-- 6. IMainView (Interface) -->
  <g transform="translate(60, 880)" filter="url(#shadow)">
    <rect x="0" y="0" width="310" height="110" rx="5" fill="#f4f5f7" stroke="#4a5568" stroke-width="1.2" />
    <circle cx="28" cy="22" r="10" fill="#9f7aea" stroke="#6b46c1" stroke-width="1" />
    <text x="28" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">I</text>
    <text x="170" y="26" text-anchor="middle" font-size="13" font-weight="bold" font-style="italic" fill="#1a202c">IMainView</text>
    <line x1="0" y1="42" x2="310" y2="42" stroke="#cbd5e0" stroke-width="1" />
    <text x="12" y="62" font-size="11" fill="#2d3748">+DisplayResults(earthWeight, results): void</text>
    <text x="12" y="80" font-size="11" fill="#2d3748">+ShowError(title: string, message: string): void</text>
    <text x="12" y="98" font-size="11" fill="#2d3748">+ShowInfo(title: string, message: string): void</text>
  </g>

  <!-- EDGES / CONNECTORS -->

  <!-- Program -> MainForm (creates) -->
  <path d="M 370 95 L 370 125 L 200 125 L 200 150" fill="none" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#openArrow)" />
  <rect x="250" y="115" width="55" height="18" fill="#ffffff" />
  <text x="277" y="128" text-anchor="middle" font-size="10.5" fill="#4a5568">creates</text>

  <!-- Program -> PlanetWeightController (creates) -->
  <path d="M 480 95 L 480 125 L 590 125 L 590 360" fill="none" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#openArrow)" />
  <rect x="520" y="115" width="55" height="18" fill="#ffffff" />
  <text x="547" y="128" text-anchor="middle" font-size="10.5" fill="#4a5568">creates</text>

  <!-- Program -> PlanetWeightModel (creates) -->
  <path d="M 425 95 L 425 520 L 320 520 L 320 560" fill="none" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#openArrow)" />
  <rect x="375" y="300" width="55" height="18" fill="#ffffff" />
  <text x="402" y="313" text-anchor="middle" font-size="10.5" fill="#4a5568">creates</text>

  <!-- MainForm -> PlanetWeightController (requests input) -->
  <path d="M 340 260 Q 430 260 480 360" fill="none" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#openArrow)" />
  <rect x="345" y="275" width="95" height="18" fill="#ffffff" />
  <text x="392" y="288" text-anchor="middle" font-size="11" font-weight="500" fill="#2b6cb0">requests input</text>

  <!-- MainForm -> PlanetWeightModel (reads state) -->
  <path d="M 190 325 L 190 560" fill="none" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#openArrow)" />
  <rect x="195" y="430" width="80" height="18" fill="#ffffff" />
  <text x="235" y="443" text-anchor="middle" font-size="11" font-weight="500" fill="#2b6cb0">reads state</text>

  <!-- MainForm -> IMainView (implements) -->
  <path d="M 40 240 L 20 240 L 20 920 L 60 920" fill="none" stroke="#6b46c1" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#openArrow)" />
  <rect x="15" y="520" width="75" height="18" fill="#ffffff" />
  <text x="52" y="533" text-anchor="middle" font-size="11" font-weight="500" fill="#6b46c1">implements</text>

  <!-- PlanetWeightController -> PlanetWeightModel (updates) -->
  <path d="M 520 495 L 520 540 L 380 540 L 380 560" fill="none" stroke="#c53030" stroke-width="1.5" marker-end="url(#openArrow)" />
  <rect x="430" y="530" width="60" height="18" fill="#ffffff" />
  <text x="460" y="543" text-anchor="middle" font-size="11" font-weight="500" fill="#c53030">updates</text>

  <!-- PlanetWeightController -> DataEntryForm (manages) -->
  <path d="M 640 495 L 640 620" fill="none" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#openArrow)" />
  <rect x="645" y="550" width="65" height="18" fill="#ffffff" />
  <text x="677" y="563" text-anchor="middle" font-size="11" font-weight="500" fill="#2b6cb0">manages</text>

  <!-- PlanetWeightModel -> IMainView (notifies) -->
  <path d="M 215 790 L 215 880" fill="none" stroke="#276749" stroke-width="1.5" marker-end="url(#openArrow)" />
  <rect x="220" y="825" width="55" height="18" fill="#ffffff" />
  <text x="247" y="838" text-anchor="middle" font-size="11" font-weight="500" fill="#276749">notifies</text>

</svg>
